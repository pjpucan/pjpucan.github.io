<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Patrick Pucan</title>
  <meta name="theme-color" content="#0d1a27">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-content: center; gap: 12px; text-align: center; padding-inline: 16px;
          background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size: 18px 18px; }
    .nf .code { font-size: clamp(4rem, 14vw, 7rem); font-weight: 700; line-height: 1; color: var(--accent); margin: 0; }
    .nf p { margin: 0; color: var(--muted); }
    .nf .btn { justify-self: center; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="nf">
    <p class="code">404</p>
    <h1 class="headline">Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a class="btn" href="./">Back to portfolio</a>
  </main>
</body>
</html>
